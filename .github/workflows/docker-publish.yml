name: Publish Docker Image

# Builds a multi-arch (linux/amd64 + linux/arm64) image and pushes it to
# Docker Hub (knoxmedia/vauldy) so users can `docker pull knoxmedia/vauldy`.
#
# Triggers:
#   - pushing a version tag (e.g. `0.1.5`)  -> pushes :latest + :<version>
#   - manual run via "workflow_dispatch"    -> pushes :<version> (+ :latest if requested)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   Docker Hub account name
#   DOCKERHUB_TOKEN      Docker Hub access token (read-write)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag override (default: git describe, e.g. 0.1.5)"
        required: false
        default: ""
      push_latest:
        description: "Also push the :latest tag"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"
      - "*.*.*"

env:
  IMAGE: knoxmedia/vauldy

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        run: |
          set -eu
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --always)"
          fi
          # Release assets use the bare version without a leading "v".
          URL_VERSION="${VERSION#v}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TAGS="${{ env.IMAGE }}:${URL_VERSION}"
          PUSH_LATEST="${{ inputs.push_latest }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            PUSH_LATEST="true"
          fi
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="${{ env.IMAGE }}:latest,${TAGS}"
          fi
          FFMPEG_URL="https://github.com/knoxmedia/Vauldy/releases/download/${URL_VERSION}/vauldy_linux_amd64.tar.gz"
          echo "version=$URL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_package_url=$FFMPEG_URL" >> "$GITHUB_OUTPUT"
          echo "Built with version=$URL_VERSION tags=$TAGS ffmpeg=$FFMPEG_URL"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            DIRTY=false
            ALLOW_DIRTY=false
            FFMPEG_PACKAGE_URL=${{ steps.meta.outputs.ffmpeg_package_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
